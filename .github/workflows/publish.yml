# Builds the production image and publishes it to the GitHub registry, for the
# machine to pull (the package is made public once by hand): see
# deploy/README.md.
# Run it by hand from the Actions tab, or it runs at every push to main.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # the app is the pre-event extract plus the work of the event: see README
      - run: bash ./setup.sh
      # ARM64 (Macs with Apple silicon, ARM servers) is built by emulation
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: mirak29
          password: ${{ secrets.GHCR_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/amd64,linux/arm64
          push: true
          # the name of a registry image is lower case
          tags: |
            ghcr.io/mirak29/defendable:latest
            ghcr.io/mirak29/defendable:${{ github.sha }}
          # the big layers (dependencies, voice weights) are reused between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
